name = "caplatch"
main = "src/index.ts"
compatibility_date = "2026-10-04"

# Non-secret configuration only. Do not put API keys or tokens in this file.
# OPENROUTER_API_KEY is a Worker secret (`wrangler secret put`), never a var.
[vars]
CAP_CENTS = "1000"
PERIOD = "month"
UPSTREAM_ENABLED = "false"
# CURRENCY is optional. Leave it unset, or set "usd", and CAP_CENTS stays US cents.
# "eur" reads CAP_CENTS as euro-cents at a fixed 110 US cents per euro (100 → 110).
# Any other value refuses POST /v1/chat/completions before reserve or fetch.

[[durable_objects.bindings]]
name = "LEDGER"
class_name = "SpendLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SpendLedger"]
